name: CI

on:
  push:
    branches: [main, 'feature/**']
    # Release/hotfix/RC tags must run CI too, or the production promotion gate
    # (ci-gate.sh) would have no check-runs to wait for at the tag's commit.
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Server tests
        run: npm run test --workspace flipblog-server

      - name: Build front-end
        run: npm run build

      - name: Web tests
        run: npm run test --workspace flipblog-web

  e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm run test:e2e
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Issue #34 acceptance: "Production build is reproducible from a clean
  # checkout". From the exact ref this job builds a self-contained versioned
  # release directory (npm ci -> Vite build -> prod-only deps via the committed
  # lockfile) and then boots that artifact as the systemd unit would and smokes
  # it: liveness, readiness, SPA, and graceful SIGTERM shutdown (exit 0).
  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Build release artifact from this exact ref
        run: npm run release:build
      - name: Smoke-test the built artifact (runtime verification)
        run: node scripts/release-smoke.mjs --release dist/releases/$(node -p "require('./package.json').version")
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: flipblog-release
          path: dist/releases/
          retention-days: 7
