name: Deploy to staging
# Issue #35: every release candidate deploys to the production-like staging
# environment. Runs on every push to `main` (each merged candidate) and can be
# triggered manually to re-deploy any version/tag.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version/tag to deploy (e.g. v1.2.0-rc.1). Leave empty to deploy the default-branch release.'
        required: false

# One staging deployment at a time — two deploys racing would fight over the
# `current` symlink and the systemd unit.
concurrency:
  group: deploy-staging-env
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Gate on required CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref }}
      - name: Refuse to deploy unless required CI is green at this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          echo "Gating on commit $SHA"
          for name in test e2e release; do
            concl=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs" \
              --jq ".check_runs | map(select(.name==\"$name\")) | sort_by(.id) | reverse | .[0] | .conclusion // \"none\"")
            echo "  $name -> ${concl:-none}"
            if [ "$concl" != "success" ]; then
              echo "::error::required CI check '$name' is not green (${concl:-none}); refusing to deploy"
              exit 1
            fi
          done
          echo "CI gate passed"

  deploy:
    name: Deploy to staging host
    needs: gate
    runs-on: ubuntu-latest
    environment: staging
    env:
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      APP_ENV_CONTENT: ${{ secrets.STAGING_APP_ENV }}
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
      SMOKE_ADMIN_USER: ${{ secrets.STAGING_ADMIN_USER }}
      SMOKE_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Write SSH key
        shell: bash
        env:
          KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          echo "SSH_KEY_PATH=$HOME/.ssh/id_ed25519" >> "$GITHUB_ENV"

      - name: Build release artifact
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          if [ -n "${{ inputs.version }}" ]; then
            npm run release:build -- --tag "${{ inputs.version }}"
            RELEASE_DIR="dist/releases/$(printf '%s' '${{ inputs.version }}' | sed 's/^v//')"
          else
            npm run release:build
            RELEASE_DIR="dist/releases/$(node -p "require('./package.json').version")"
          fi
          echo "RELEASE_DIR=$RELEASE_DIR" >> "$GITHUB_ENV"
          echo "built release: $RELEASE_DIR"

      - name: Pre-deploy artifact smoke (local)
        shell: bash
        run: node scripts/release-smoke.mjs --release "$RELEASE_DIR"

      - name: Deploy to staging host (readiness-gated, auto-rollback)
        shell: bash
        run: |
          export VERSION="$(basename "$RELEASE_DIR")"
          bash scripts/deploy.sh

      - name: Post-deploy smoke (health, login, publish, reader, uploads)
        shell: bash
        run: |
          node scripts/post-deploy-smoke.mjs \
            --base-url "$STAGING_BASE_URL" \
            --username "$SMOKE_ADMIN_USER" \
            --password "$SMOKE_ADMIN_PASSWORD"